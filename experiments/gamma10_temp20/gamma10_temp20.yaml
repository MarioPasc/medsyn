data:
  flag: pathmnist
  size: 64
  download_dir: /media/mpascual/PortableSSD/medsyn/PathMNIST/data_raw         # guarda pathmnist.npz
  save_png:
    enabled: false
    processed_dir: /media/mpascual/PortableSSD/medsyn/PathMNIST/data_processed  # almacena PNGs por split
    index_json: /media/mpascual/PortableSSD/medsyn/PathMNIST/indexes/pathmnist_index.json
    yolo_folder_dataset: /home/mpascual/research/datasets/medsyn/PathMNIST/yolo_cls_dataset  # YOLO classification dataset root
    yolo_use_symlinks: true           # true: create symlinks, false: copy files
    yolo_allow_copy_fallback: true    # if symlinks fail, fall back to copying (only if yolo_use_symlinks=true)
  postprocess_npz:
    enabled: true
    npz_path: ${DATASET_PATH}
  seed: 23102003
  num_workers: 1
  reduction:
    strategy: fraction
    train: 1.00
    val: 1.00
    test: 1.00
    max_per_class: null

ccddpm:
  # Distributed training configuration (multi-GPU with DDP)
  # To use multi-GPU training, launch with torchrun:
  # torchrun --standalone --nnodes=1 --nproc_per_node=N -m medsyn.cli.train_ccDDPM picasso_cfg.yaml
  dist:
    enabled: false  # Set to true to enable multi-GPU distributed training
    backend: nccl  # Use 'nccl' for GPU training (fastest), 'gloo' for CPU
    num_gpus: 2  # 'auto' uses all available GPUs (set by torchrun)
    find_unused_parameters: false  # Set to true only if you have conditional/dynamic graph
    broadcast_buffers: true  # Sync batch norm stats across GPUs
    grad_accum_steps: 1  # Gradient accumulation steps (1 = no accumulation)
    seed_offset: 0  # Offset for per-rank seed decorrelation

  # ========================================================================
  # LOGGING CONFIGURATION
  # ========================================================================
  logging:
    embeddings:
      enabled: true
      log_every_n_epochs: 1  # Log detailed diagnostics every 1 epoch
      output_dir: embeddings  # Relative to main output_dir
      save_class_embeddings: true  # Always save class embedding trajectory

      # Option 1: Use preset (uncomment to use)
      # preset: custom  # Options: minimal, custom, research

      # Option 2: Manual configuration (overrides preset if both specified)
      probe:
        enabled: true
        samples_per_class: 50  # Number of samples per class in probe set
        timesteps: [100, 500, 900]  # Early, mid, late diffusion
        layer_names:
          - unet.down_blocks.1  # Intermediate encoding with attention
          - unet.mid_block      # Critical bottleneck representation
          - unet.up_blocks.1    # Intermediate decoding with attention

        save_both_branches: true  # Save both conditional and unconditional
        pooling_strategy: mean  # mean, max, or flatten

      clustering:
        enabled: true
        n_clusters: null  # null = auto-detect from num_classes
        algorithm: kmeans  # kmeans or gmm
        random_state: 42
        compute_scores: true  # Compute silhouette, CH, DB scores

      metadata:
        save_metadata: true
        dataset_name: PathMNIST
        class_names:  # Optional - will be auto-detected for PathMNIST
          - Adipose
          - Background
          - Debris
          - Lymphocytes
          - Mucus
          - Smooth Muscle
          - Normal Colon Mucosa
          - Cancer-Associated Stroma
          - Colorectal Adenocarcinoma Epithelium

  dataloader:
    type: npz # Options are JSON, if we are using the index json file or NPZ.

  # Data augmentation configuration (optional)
  # Augmentation is applied only during training, not validation/testing
  # Requires: pip install albumentations
  augmentation:
    enabled: true  # Set to true to enable augmentation
    probability: 0.5  # Overall probability of applying augmentation to an image (0.0-1.0)
    preserve_range: true  # Clamp outputs to [-1, 1] after augmentation
    normalize_after_augment: true  # Re-normalize after augmentation

    # List of transforms to apply (each with individual probability p)
    # Available transforms: any albumentations transform (e.g., HorizontalFlip, Rotate, GaussNoise)
    # See: https://albumentations.ai/docs/api_reference/augmentations/
    transforms:
      # Geometric transforms (conservative for medical images)
      - name: HorizontalFlip
        p: 0.5
      - name: VerticalFlip
        p: 0.5
      # Intensity transforms (careful with medical imaging)
      - name: RandomBrightnessContrast
        p: 0.3
        brightness_limit: 0.1
        contrast_limit: 0.1

    # Statistics tracking (CSV output)
    statistics:
      enabled: true  # Track which augmentations were applied
      output_path: augmentation_stats.csv  # Relative to output_dir or absolute path
      save_every_n_epochs: 1  # 0 = save only at end, 1 = every epoch, etc.

  # ========================================================================
  # DENOISING UNET ARCHITECTURE
  # ========================================================================
  # Full configuration for the UNet2DModel backbone.
  # All parameters directly map to diffusers.UNet2DModel constructor arguments.
  # See: https://huggingface.co/docs/diffusers/api/models/unet2d
  #
  # IMPORTANT: Validation rules:
  #   - len(channel_mult) == len(down_block_types) == len(up_block_types)
  #   - model_channels must be divisible by norm_num_groups
  #   - All block_out_channels (model_channels * channel_mult[i]) must be divisible by norm_num_groups
  # ========================================================================
  denoising_unet:
    # Core architecture
    model_channels: 128           # Base channel count (multiplied by channel_mult)
    channel_mult: [1, 2, 2, 4]    # Channel multipliers per level -> block_out_channels: [128, 256, 256, 512]
    layers_per_block: 2           # Number of ResNet blocks per level

    # Block types - MUST match length of channel_mult (4 levels in this case)
    # Available down blocks: DownBlock2D, AttnDownBlock2D, CrossAttnDownBlock2D, DownEncoderBlock2D
    # Available up blocks: UpBlock2D, AttnUpBlock2D, CrossAttnUpBlock2D, UpDecoderBlock2D
    down_block_types:
      - DownBlock2D                   # Level 0: 64->32 (no attention)
      - AttnDownBlock2D               # Level 1: 32->16 (with attention)
      - AttnDownBlock2D               # Level 2: 16->8  (with attention)
      - AttnDownBlock2D               # Level 3: 8->4   (with attention)
    up_block_types:
      - AttnUpBlock2D                 # Level 3: 4->8   (with attention)
      - AttnUpBlock2D                 # Level 2: 8->16  (with attention)
      - AttnUpBlock2D                 # Level 1: 16->32 (with attention)
      - UpBlock2D                     # Level 0: 32->64 (no attention)

    # Attention configuration
    add_attention: true           # Enable attention blocks (required for AttnDownBlock2D/AttnUpBlock2D)
    attention_head_dim: 32         # Dimension of attention heads (null for default)

    # Normalization
    norm_num_groups: 32           # Groups for GroupNorm (model_channels must be divisible by this)
    attn_norm_num_groups: null    # Groups for attention norm (null = use norm_num_groups)
    norm_eps: 1.0e-5              # Epsilon for normalization

    # Dropout and regularization
    dropout: 0.05                  # Dropout rate (0.0 = no dropout)

    # Time embedding
    time_embedding_type: positional      # "positional" or "fourier"
    freq_shift: 0                        # Frequency shift for time embedding
    flip_sin_to_cos: true                # Whether to flip sin to cos in time embedding
    resnet_time_scale_shift: scale_shift # "default", "scale_shift", or "ada_group"
    # https://huggingface.co/spaces/QinLei086/Curvilinear_Object_Generation_by_Text_and_Segmap/blob/main/model/blocks/ResnetBlock2D.py 

    # Sampling configuration
    center_input_sample: false    # Center input sample (for specific preprocessing)
    mid_block_scale_factor: 1.0   # Scale factor for middle block

    # Downsampling/Upsampling
    downsample_padding: 1         # Padding for downsampling convolutions
    downsample_type: conv         # "conv" or "resnet"
    upsample_type: conv           # "conv" or "resnet"

    # Activation function
    act_fn: silu                  # "silu", "mish", "gelu", "relu", "swish"

    # Class embedding (handled externally via ClassEmbedder, but available for UNet's internal use)
    class_embed_type: null        # null, "timestep", or "identity"
    num_class_embeds: null        # Number of class embeddings (null = use num_classes from train config)
    num_train_timesteps: null     # Number of train timesteps (null = use from scheduler config)

    # Ho, J., Jain, A., & Abbeel, P. (2020). "Denoising Diffusion Probabilistic Models." NeurIPS.
    # Nichol, A., & Dhariwal, P. (2021). "Improved Denoising Diffusion Probabilistic Models." ICML.
    # Dhariwal, P., & Nichol, A. (2021). "Diffusion Models Beat GANs on Image Synthesis." NeurIPS.
    # Karras, T., et al. (2022). "Elucidating the Design Space of Diffusion-Based Generative Models." NeurIPS.
    # Vaswani, A., et al. (2017). "Attention Is All You Need." NeurIPS.

  train:
    image_size: 64
    in_channels: 3
    class_embed_dim: 64
    num_classes: 9
    batch_size: 64
    epochs: 200 # ↑ from 100

    # ========================================================================
    # EARLY STOPPING CONFIGURATION
    # ========================================================================
    # Early stopping is based on a composite validation score combining PSNR and SSIM.
    # The score is smoothed with an exponential moving average (EMA) to reduce noise sensitivity.
    #
    # Composite score formula:
    #   S = (psnr_weight * PSNR / 20) + (ssim_weight * SSIM)
    # where PSNR is divided by 20 to put it on a similar scale to SSIM (both ~0-1).
    #
    # EMA smoothing: S_ema_t = ema_alpha * S_ema_{t-1} + (1 - ema_alpha) * S_t
    # Higher ema_alpha means more smoothing (less sensitive to single-epoch fluctuations).
    early_stopping:
      patience: 15              # ↑ from 8
      metric: "psnr_ssim_composite"  # Metric to use: "psnr_ssim_composite", "psnr", "ssim", or "loss"
      psnr_weight: 1.0         # Weight for PSNR in composite score
      ssim_weight: 1.0         # Weight for SSIM in composite score
      ema_alpha: 0.7           # EMA smoothing factor (0 = no smoothing, 0.9 = heavy smoothing)
      use_ema_for_stopping: true  # If true, use smoothed score for early stopping decisions
      min_delta: 0.001         # Minimum improvement to count as "better"

    mixed_precision: true

    grad_clip_norm: 1.0        
    guidance_p_uncond: 0.1     # Classifier-free guidance: 10% unconditional during training

    ema_use: true
    ema_decay: 0.9999

    use_min_snr: true          # Min-SNR weighting
    min_snr_gamma: 10.0         # Standard value for Min-SNR 
    per_class_loss_weighting: true  # Use per-class loss weighting to address class imbalance
    per_class_weight_temperature: 2.0  # ↑ from 1.2 (moderate increase)

    ckpt_every_epochs: 10      # Save checkpoint every X epochs (in addition to best and last)
    snapshot_class_embedding_every: 1 # Save class embedding snapshots every X epochs
    use_tqdm: false             # Enable/disable tqdm progress bars (set false for cleaner HPC logs)
    skip_nonfinite_grads: true  # Skip batches with non-finite gradients instead of  aborting
    output_dir: ${OUTPUT_DIR}

    # ========================================================================
    # LEARNING RATE SCHEDULER CONFIGURATION
    # ========================================================================
    # Supports: "onecycle", "cosine", "linear_warmup_cosine_annealing_lr", "constant", "step"
    lr_scheduler:
      type: "linear_warmup_cosine_annealing_lr"

      # OneCycle parameters (used when type == "onecycle")
      max_lr: 1.0e-4
      pct_start: 0.3
      div_factor: 25.0
      final_div_factor: 1000.0

      # Cosine / warmup parameters
      T_max: null             # Used only for pure "cosine" scheduler; ignored for warmup+cosine
      eta_min: 1.0e-7         # Minimum LR at the end of cosine phase

      warmup_epochs: 20         # ↑ from 10 — 10% of 200 epochs
      # New parameters for LinearWarmupCosineAnnealingLR-like schedule
      warmup_start_lr: null   # Absolute LR at the very first step of warmup.
                              # If null, computed as warmup_start_factor * base_lr.
      warmup_start_factor: 0.001  # ↓ from 0.01 — gentler warmup start

      # Step parameters (used when type == "step")
      step_size: 30
      gamma: 0.1


  # ========================================================================
  # OPTIMIZER CONFIGURATION
  # ========================================================================
  # Supported types: adamw (default), adam, sgd, rmsprop
  optimizer:
    type: "adamw"              # Optimizer type: adamw, adam, sgd, rmsprop
    lr: 1.0e-4                 # Learning rate (if you see overflows, try 1.0e-4)
    wd: 0.01                    # Weight decay (L2 regularization)
    # Adam/AdamW/Lion specific
    betas: [0.9, 0.999]        # Beta coefficients for Adam
    eps: 1.0e-8                # Epsilon for numerical stability
    amsgrad: false             # Whether to use AMSGrad variant
    # SGD specific (only used when type="sgd")
    momentum: 0.9              # Momentum factor
    nesterov: false            # Whether to use Nesterov momentum
    # RMSprop specific (only used when type="rmsprop")
    alpha: 0.99                # Smoothing constant
    centered: false            # Whether to compute centered RMSprop

  sched:
    num_train_timesteps: 1000
    beta_start: 1.0e-4
    beta_end: 2.0e-2
    beta_schedule: squaredcos_cap_v2  # Stabilizes SNR across timesteps; improves sample quality
    prediction_type: epsilon  # Standard DDPM prediction (predicts noise ε). DO NOT change without updating loss.py!
  infer:
    guidance_scale: 2.5  # Classifier-free guidance scale (1.0 = no CFG, 1.5-3.0 for enhanced conditioning)
    sampler: ddim        # Sampler type: ddim, ddpm
    
    eta: 0.0            # DDIM eta parameter (0.0 = deterministic, 1.0 = stochastic)
    num_inference_steps: 100
    
    out_dir: ${OUTPUT_DIR}/samples


# Generation configuration 
generate:
  model_type: ccddpm # use ccDDPM or bVAE, we will call either cli/generate_ccddpm.py or cli/generate_bvae.py bVAE is DEPRECATED at this moment
  checkpoint: ${OUTPUT_DIR}/ckpts/best.pt  # absolute path to checkpoint
  npz_with_synth_images:
    save_to: ${OUTPUT_DIR}/synth
    train:
      classes:
        0: 10000
        1: 10000
        2: 10000
        3: 10000
        4: 10000
        5: 10000
        6: 10000
        7: 10000
        8: 10000

yolo:
  # For "data:" we are going to read data/postprocess_npz/npz_path from above, if this path does not exist, 
  # fallback to data/save_png/yolo_folder_dataset, which should contain the YOLO classification dataset structure, so we
  # would not longer be loading our custom dataloader, but use YOLO's built-in dataloader instead. However, the npz dataloader
  # is preferred as the main source.
  model: /mnt/home/users/tic_163_uma/mpascual/execs/YOLO_PATHMNIST/yolov8n-cls.pt        # any Ultralytics classify model
  project: /mnt/home/users/tic_163_uma/mpascual/fscratch/results/yolo_classifier
  name: picasso_yolo_parallel
  imgsz: 64
  epochs: 100
  batch: 128
  workers: 8
  training_images: PathMNIST   # one of: PathMNIST | PathMNIST_and_synth | synth

# =============================================================================
# FID COMPUTATION CONFIGURATION
# =============================================================================
# Configuration for Fréchet Inception Distance (FID) computation during
# training validation. FID requires InceptionV3 weights which are typically
# downloaded automatically. For HPC clusters without internet, pre-download
# the weights using: python scripts/predownload_fid_weights.py --cache_dir /path/to/cache
#
# Then either:
#   1. Set TORCH_HOME=/path/to/cache environment variable, OR
#   2. Set weights_path below to the full path to the weights file
fid:
  enabled: false                    # Enable FID computation during validation
  samples_per_class: 100           # Number of generated samples per class for FID
  batch_size: 32                   # Batch size for FID feature extraction
  min_samples: 50                  # Minimum samples needed per class for valid FID
  # Offline weights path (for HPC clusters without internet)
  # Leave null to use automatic download via TORCH_HOME
  # Example: /scratch/models/torch_cache/hub/checkpoints/weights-inception-2015-12-05-6726825d.pth
  weights_path: /mnt/home/users/tic_163_uma/mpascual/fscratch/pretrained_fid_weights/hub/checkpoints/weights-inception-2015-12-05-6726825d.pth

bVAE:
  model:
    in_channels: 3
    img_size: 64
    latent_dim: 32
    base_channels: 64
    num_down: 4
    decoder_sigmoid: true
    num_classes: 9
    conditioning: "film"           # keep FiLM in encoder
    decoder_conditioning: false    # NEW: off in decoder until KL>0
    class_embed_dim: 64
    use_class_prior: false    # UPDATED: start vanilla; enable after recon stabilizes

  train:
    epochs: 100               # UPDATED: longer training for cyclical schedule (was 80)
    batch_size: 16
    num_workers: 4
    device: "cuda"
    mixed_precision: true
    grad_clip_norm: 5.0            # UPDATED: less aggressive clipping (was 1.0)
    seed: 17
    output_dir: "/home/mpascual/research/datasets/medsyn/bVAE"
    save_every_epoch: 10
    # Lagging-inference mitigation: extra encoder updates in early training
    encoder_extra_steps: 2    # UPDATED: mitigate lagging inference (was 1)
    encoder_heavy_epochs: 5   # UPDATED: first epochs only (was 15)

  optim:
    optimizer: "adamw"
    lr_init: 0.0001           # UPDATED: lower init LR for stability (was 0.0002)
    weight_decay: 0.0001      # UPDATED: moderate regularization (was 0.001)
    betas: [0.9, 0.999]
    eps: 1.0e-8

  sched:
    use_onecycle: true
    max_lr: 0.0001            # UPDATED: capped at 1e-4 for stability (was 2e-4)
    pct_start: 0.5            # UPDATED: longer warm-up, later peak (was 0.4)
    div_factor: 10.0          # UPDATED: smoother start (was 25.0)
    final_div_factor: 1000.0  # UPDATED: gentler final decay (was 10000.0)

  loss:
    recon_type: "l1"          # UPDATED: SSIM later after stability (was l1_ssim)
    l1_weight: 1.0            # para l1|l1_ssim
    ssim_weight: 0.85         # para l1_ssim (1-SSIM)
    beta: 1.0                 # valor techo; el scheduler lo modula
    kld_weight: 1.0
    recon_weight: 1.0
    free_bits_nats: 0.5            # UPDATED: per-dim; stops tiny-KL from shrinking further (was 0.0)
    beta_schedule:            # cyclical β to avoid vanishing KL
      type: "cyclical"        # UPDATED: cyclical to prevent KL vanishing (was monotonic)
      beta_min: 0.0
      beta_max: 0.3           # UPDATED: gentler ceiling for 64×64 tiles (was 0.6)
      cycles: 4               # UPDATED: 4 cycles for gradual KL recovery (was 3)
      ratio_increase: 0.7     # UPDATED: longer warm-up phase (was 0.5)
    capacity:
      use: false              # UPDATED: start disabled to avoid early KL pinning (was true)
      C_max: 1.0              # UPDATED: modest per-dim target (was 2.0)
      steps_to_max: 70000     # UPDATED: ramp over ~70% of training (was 30000)
      gamma: 50.0             # UPDATED: gentler pull when enabled (was 200.0)
    prior_reg_w: 0.0001       # L2 regularization on class prior parameters
    infovae_mmd:              # InfoVAE-MMD: regulariza q(z) hacia p(z|y)
      use: false              # UPDATED: disable until KL stabilizes (was true)
      weight: 0.5             # UPDATED: conservative weight (was 3.0)
      kernel: "rbf"
    per_class_mmd_use: false  # NEW: per-class MMD q(z|x,y) vs p(z|y)
    per_class_mmd_w: 1.0      # weight for per-class MMD (if enabled)

