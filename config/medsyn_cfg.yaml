data:
  flag: pathmnist
  size: 28
  download_dir: /home/mpascual/research/datasets/medsyn/PathMNIST/data_raw         # guarda pathmnist.npz
  processed_dir: /home/mpascual/research/datasets/medsyn/PathMNIST/data_processed  # almacena PNGs por split
  index_json: /home/mpascual/research/datasets/medsyn/PathMNIST/indexes/pathmnist_index.json
  seed: 23102003
  num_workers: 4
  reduction:
    strategy: fraction
    train: 0.20
    val: 1.00
    test: 1.00
    max_per_class: null

bVAE:
  model:
    in_channels: 3
    img_size: 28
    latent_dim: 16
    base_channels: 32
    num_down: 3
    decoder_sigmoid: true
    # --- conditional params ---
    num_classes: 9            # PathMNIST
    conditioning: "film"      # "film" o "none"
    class_embed_dim: 32       # para FiLM

  train:
    epochs: 50
    batch_size: 128
    num_workers: 4
    device: "cuda"
    mixed_precision: true
    grad_clip_norm: 1.0
    seed: 17
    output_dir: "./outputs/bvae"

  optim:
    optimizer: "adamw"
    lr_init: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1.0e-8

  sched:
    use_onecycle: true
    max_lr: 0.0003
    pct_start: 0.3
    div_factor: 25.0
    final_div_factor: 10000.0

  loss:
    beta: 2.0
    recon_type: "mse"
    recon_weight: 1.0
    kld_weight: 1.0

# Generation configuration (outside bVAE section)
generate:
  checkpoint: "/home/mpascual/research/code/medsyn/outputs/bvae/ckpts/best.pt"  # absolute path to checkpoint
  classes:
    0: 100
    1: 100
    2: 100
    3: 100
    4: 100
    5: 100
    6: 100
    7: 100
    8: 100
