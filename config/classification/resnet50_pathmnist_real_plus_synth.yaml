# ResNet50 Classification - Real + Synthetic Images
# Configuration using both real and synthetic PathMNIST images

experiment:
  name: "pathmnist_resnet50_real_plus_synth"
  output_dir: "experiments/classification/resnet50_real_plus_synth"
  seed: 42
  device: "cuda"

data:
  npz_path: "/media/mpascual/PortableSSD/medsyn/PathMNIST/merged.npz"
  regime: "real_plus_synth"  # Real + synthetic images
  num_folds: 5               # 5-fold cross-validation
  num_workers: 4
  batch_size: 64
  image_size: 64

model:
  name: "resnet50"
  pretrained: true
  num_classes: 9
  freeze_backbone: false
  dropout: 0.0

optimization:
  optimizer: "adamw"
  lr: 1e-4
  weight_decay: 1e-2
  betas: [0.9, 0.999]

scheduler:
  scheduler: "cosine"
  warmup_epochs: 5
  eta_min: 1e-7
  step_size: 30
  gamma: 0.1

training:
  max_epochs: 100
  early_stopping_patience: 15
  grad_clip_norm: 1.0
  mixed_precision: true
  checkpoint_every: 10
  log_every: 10

# No augmentation for real_plus_synth regime
augmentation:
  enabled: false
