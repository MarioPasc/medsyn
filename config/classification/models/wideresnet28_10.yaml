# WideResNet-28-10 Model Configuration
# Reusable across all datasets and training regimes
#
# This config defines model architecture, optimization, scheduler, and training settings.
# Dataset-specific settings (data paths, regime, augmentation) are in experiment YAMLs.

model:
  name: "wideresnet28_10"  # Reference only, overridden by experiment YAML
  pretrained: false  # WideResNet trained from scratch
  # num_classes: Set by experiment YAML based on dataset
  freeze_backbone: false
  dropout: 0.3  # Standard dropout for WideResNet

optimization:
  optimizer: "sgd"  # SGD is standard for WideResNet
  lr: 0.1
  weight_decay: 0.0005
  momentum: 0.9
  betas: [0.9, 0.999]  # Used for Adam/AdamW if switched

scheduler:
  scheduler: "cosine"
  warmup_epochs: 0
  eta_min: 0.0
  step_size: 30
  gamma: 0.2

training:
  max_epochs: 100
  early_stopping_patience: 8
  grad_clip_norm: 0.0  # No gradient clipping for WideResNet
  mixed_precision: true
  checkpoint_every: 25
  log_every: 1
