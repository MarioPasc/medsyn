# ResNet50 Model Configuration
# Reusable across all datasets and training regimes
#
# This config defines model architecture, optimization, scheduler, and training settings.
# Dataset-specific settings (data paths, regime, augmentation) are in experiment YAMLs.

model:
  name: "resnet50"  # Reference only, overridden by experiment YAML
  pretrained: true
  # num_classes: Set by experiment YAML based on dataset
  freeze_backbone: false
  dropout: 0.0

optimization:
  optimizer: "adamw"
  lr: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  scheduler: "cosine"
  warmup_epochs: 5
  eta_min: 0.0000001
  step_size: 30
  gamma: 0.1

training:
  max_epochs: 50
  early_stopping_patience: 10
  grad_clip_norm: 1.0
  mixed_precision: true
  checkpoint_every: 10
  log_every: 1
