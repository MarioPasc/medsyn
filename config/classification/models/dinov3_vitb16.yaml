# DINOv3 ViT-B/16 Model Configuration
# Reusable across all datasets and training regimes
#
# Uses Meta AI's DINOv3 with self-supervised pretraining
# Classification via custom head on top of pretrained ViT backbone

model:
  name: "dinov3_vitb16"
  pretrained: true  # Load Meta AI pretrained DINOv3 weights
  # num_classes: Set by experiment YAML based on dataset
  freeze_backbone: false  # If true, only train classification head
  dropout: 0.0  # Dropout before classification layer

  # DINOv3-specific settings (optional, accessed via getattr with defaults)
  dinov3_variant: "dinov3_vitb16"  # PyTorch Hub model name
  dinov3_repo: "facebookresearch/dinov3"  # PyTorch Hub repo

optimization:
  optimizer: "adamw"
  lr: 0.00005  # 5e-5 (same as CLIP) - ViTs need smaller updates
  weight_decay: 0.01
  betas: [0.9, 0.999]

  # Note: Differential learning rates applied in build_optimizer():
  # - backbone: lr * 0.1 (pretrained, needs smaller updates)
  # - classification_head: lr * 1.0 (new layer, needs larger updates)

scheduler:
  scheduler: "cosine"
  warmup_epochs: 10  # Longer warmup for ViT (same as CLIP)
  eta_min: 0.000001  # 1e-6
  step_size: 30  # For step scheduler
  gamma: 0.1  # LR decay factor

training:
  max_epochs: 15  # Same as ResNet50 and CLIP
  early_stopping_patience: 10  # Same as CLIP
  grad_clip_norm: 1.0  # Gradient clipping
  mixed_precision: true  # torch.cuda.amp for memory efficiency
  checkpoint_every: 5  # Save checkpoint every 5 epochs
  log_every: 1  # Log metrics every epoch
