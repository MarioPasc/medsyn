# PathMNIST Classification - Real Images + Traditional Augmentation
# Uses real PathMNIST images with traditional data augmentation (no synthetic data)

# Reference to model configuration
model_config: "/home/mariopascual/projects/diffusion/medsyn/config/classification/models/resnet50.yaml"

experiment:
  name: "pathmnist_resnet50_real_plus_trad_aug"
  output_dir: "/media/hddb/mario/results/medsyn/experiments/classification/resnet50_real_plus_trad_aug"
  seed: 42
  device: "cuda:1"

data:
  npz_path: "/media/hddb/mario/data/medsyn/merged_datasets/cfg_medsyn_synth.npz"
  regime: "real_plus_trad_aug"  # Real images + traditional augmentation
  num_folds: 5                  # 5-fold cross-validation
  num_workers: 4
  batch_size: 64
  image_size: 64

model:
  name: "resnet50"  # Model architecture to use
  num_classes: 9    # PathMNIST has 9 classes

# Traditional augmentation enabled for this regime
augmentation:
  enabled: true
  probability: 0.8
  preserve_range: true
  normalize_after_augment: true
  transforms:
    - name: HorizontalFlip
      p: 0.5
    - name: VerticalFlip
      p: 0.5
    - name: Rotate
      p: 0.3
      limit: 10
    - name: RandomBrightnessContrast
      p: 0.3
      brightness_limit: 0.2
      contrast_limit: 0.2
    - name: GaussNoise
      p: 0.2
      var_limit: [10.0, 50.0]
