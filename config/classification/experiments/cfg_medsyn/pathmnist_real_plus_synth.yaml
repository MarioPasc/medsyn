# PathMNIST Classification - Real + CFG-MedSyn Synthetic Images
# Uses real PathMNIST images combined with synthetic images from CFG-MedSyn

# Reference to model configuration
model_config: "/home/mariopascual/projects/diffusion/medsyn/config/classification/models/resnet50.yaml"

experiment:
  name: "pathmnist_{classifier}_real_plus_synth_cfgmedsyn"
  output_dir: "/media/hddb/mario/results/medsyn/experiments/classification/{experiment_name}"
  seed: 42
  device: "cuda:1"

data:
  npz_path: "/media/hddb/mario/data/medsyn/merged_datasets/cfg_medsyn_synth.npz"
  regime: "real_plus_synth"  # Real + synthetic images
  num_folds: 5               # 5-fold cross-validation
  num_workers: 4
  batch_size: 64
  image_size: 64

model:
  name: "resnet50"  # Model architecture to use
  num_classes: 9    # PathMNIST has 9 classes

# No augmentation for real_plus_synth regime
augmentation:
  enabled: false
