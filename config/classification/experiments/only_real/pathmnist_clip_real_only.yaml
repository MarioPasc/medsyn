# PathMNIST Classification - CLIP ViT-B/16 - Real Images Only (Baseline)
# Uses only real PathMNIST images, no synthetic data or augmentation

# Reference to CLIP model configuration
model_config: "/home/mariopascual/projects/diffusion/medsyn/config/classification/models/clip_vit_b16.yaml"

experiment:
  name: "pathmnist_clip_vit_b16_real_only"
  output_dir: "/media/hddb/mario/results/medsyn/experiments/classification/clip_vit_b16_real_only"
  seed: 42
  device: "cuda:0"

data:
  npz_path: "/media/hddb/mario/data/medsyn/merged_datasets/cfg_medsyn_synth.npz"
  regime: "real_only"  # Real images only
  num_folds: 5         # 5-fold cross-validation
  num_workers: 4
  batch_size: 64       # Adjust based on GPU memory
  image_size: 224      # CLIP native resolution (vs 64 for ResNet50)

model:
  name: "clip_vit_b16"  # Model architecture to use
  num_classes: 9        # PathMNIST has 9 classes

# No augmentation for real_only regime
augmentation:
  enabled: false
