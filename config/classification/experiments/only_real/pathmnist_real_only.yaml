# PathMNIST Classification - Real Images Only (Baseline)
# Uses only real PathMNIST images, no synthetic data or augmentation

# Reference to model configuration
model_config: "/home/mariopascual/projects/diffusion/medsyn/config/classification/models/resnet50.yaml"

experiment:
  name: "pathmnist_resnet50_real_only"
  output_dir: "/media/hddb/mario/results/medsyn/experiments/classification/resnet50_real_only"
  seed: 42
  device: "cuda:1"

data:
  npz_path: "/media/hddb/mario/data/medsyn/merged_datasets/cfg_medsyn_synth.npz"
  regime: "real_only"  # Real images only
  num_folds: 5         # 5-fold cross-validation
  num_workers: 4
  batch_size: 64
  image_size: 64

model:
  name: "resnet50"  # Model architecture to use
  num_classes: 9    # PathMNIST has 9 classes

# No augmentation for real_only regime
augmentation:
  enabled: false
