[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medsyn"
version = "0.1.0"
description = "Medical Image Synthesis project for in-depth evaluation of synthesis models (bVAE) on medical image datasets (PathMNIST)"
readme = "README.md"
requires-python = ">=3.10.6"
license = {file = "LICENSE"}
keywords = [
    "medical-imaging",
    "image-synthesis",
    "VAE",
    "beta-VAE",
    "PathMNIST",
    "MedMNIST",
    "class-balancing",
    "deep-learning",
    "pytorch",
    "ablumentationsx"
]
authors = [
    {name = "M.Pascual-González", email = "mpascual@uma.es"},
    {name = "Martina Cebolla Salas", email = "martinacesalas@gmail.com"}
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "medmnist>=2.2.0",
    "pyyaml>=6.0",
    "pillow>=9.0.0",
    "tqdm>=4.64.0",
    "pytorch_msssim",
    "diffusers>=0.21.0",
    "torchmetrics>=0.11.0",
    "matplotlib>=3.5.0",
    "ultralytics>=8.0.0",
    "scienceplots>=1.0.0",
    "albumentationsx",
    "seaborn>=0.12.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
# Optional dependencies for FID and generation quality metrics
# Install with: pip install -e ".[metrics]"
metrics = [
    "torch-fidelity>=0.3.0",  # For FID/IS/KID computation
    "clean-fid>=0.1.35",       # Alternative FID implementation
    "lpips>=0.1.4",            # Learned Perceptual Image Patch Similarity
]

# Optional dependencies for DistDiff integration
# Install with: pip install -e ".[distdiff]"
# Or create separate conda env and install: pip install -e ".[distdiff]"
distdiff = [
    # Core dependencies for DistDiff (not already in base)
    "scipy>=1.9.0",
    "scikit-image>=0.19.0",
    "timm>=0.6.12",
    "regex>=2022.1.18",
    "packaging>=21.3",

    # Hugging Face ecosystem (specific versions for DistDiff compatibility)
    "transformers>=4.29,<5",  # DistDiff requires this specific version
    "accelerate>=0.12.0",
    "huggingface-hub>=0.8.1",
    "diffusers[torch]>=0.21,<0.30",
    # CLIP for text-image embeddings
    "open-clip-torch>=2.0.0",

    # Optional: CutMix augmentation (not required but recommended)
    # "cutmix @ git+https://github.com/ildoonet/cutmix",  # Commented out - install manually if needed
]

[project.urls]
Homepage = "https://github.com/MarioPasc/medsyn"
Documentation = "https://github.com/MarioPasc/medsyn#readme"
Repository = "https://github.com/MarioPasc/medsyn"
"Bug Tracker" = "https://github.com/MarioPasc/medsyn/issues"
Changelog = "https://github.com/MarioPasc/medsyn/releases"

[project.scripts]
medsyn-prepare-data = "medsyn.cli.data:main"
bvae-train = "medsyn.cli.train_bVAE:main"
bvae-generate = "medsyn.cli.generate_bVAE:main"
ccddpm-train = "medsyn.cli.train_ccDDPM:main"
ccddpm-generate = "medsyn.cli.generate_ccDDPM:main"
ccddpm-audit = "medsyn.analysis.audit_ccddpm_privacy:cli_main"
medsyn-analyze-embeddings = "medsyn.analysis.visualize_embedding_evolution:main"

[tool.setuptools]
packages = [
    "medsyn",
    "medsyn.cli",
    "medsyn.data",
    "medsyn.models",
    "medsyn.models.bVAE",
    "medsyn.models.bVAE.engine",
    "medsyn.models.ccDDPM",
    "medsyn.models.ccDDPM.engine",
    "medsyn.utils",
    "medsyn.analysis"
]

[tool.setuptools.package-data]
medsyn = ["py.typed"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "medmnist.*",
    "torch.*",
    "torchvision.*",
    "yaml",
    "pandas",
]
ignore_missing_imports = true
